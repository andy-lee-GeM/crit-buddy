# 48Y HALEU Minimum Spacing Study
# What is the minimum safe spacing between cylinders?
#
# Focus: 2x2 array (interaction case), sweep spacing finely

problem: cylinder_array_3d
name: "48Y HALEU Minimum Spacing"

# Cylinder specification
cylinder_type: 48y
