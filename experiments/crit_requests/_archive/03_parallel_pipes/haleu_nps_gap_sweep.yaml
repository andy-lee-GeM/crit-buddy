# Parallel Pipes (3x) - HALEU Comprehensive Sweep
# 3-D Sweep: Enrichment x Pipe Size x Gap
# Output: Results table showing k-eff vs all parameters
#
# Total cases: 2 enrichments x 4 pipe sizes x 6 gaps = 48 cases

problem: pipe
name: "Parallel Pipes (3x) - HALEU NPS/Gap Sweep"

cols: 3

# Enrichment sweep (HALEU range)
enrichment: [20, 24]

# Pipe size sweep (NPS 3" to 6")
pipe_size: ["3", "4", "5", "6"]

# Gap sweep (2-7 cm edge-to-edge)
gap_cm: [2, 4, 6]

# Fixed geometry
length_cm: 200

# Fixed parameters
uf6_density: 5.09
wall_material: ss304
water_density: 0.5  # Peak reactivity from Phase 0
water_thickness_cm: 30
