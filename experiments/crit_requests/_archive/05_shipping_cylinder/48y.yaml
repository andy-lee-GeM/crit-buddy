# 48Y Cylinder (Accidental Fill with Product) - Enrichment Sweep
# 1-D Sweep: Enrichment
# Output: Line graph + table showing k-eff vs enrichment
# Note: 48Y is a feed cylinder - this models accidental fill with enriched product
# Geometry: ANSI N14.1 48Y cylinder from registry

problem: shipping_cylinder
name: "48Y Accidental Fill with Product"

# Use standard 48Y dimensions from cylinder registry
cylinder_type: 48y

# 1-D sweep: enrichment
enrichment: [5, 10, 15, 20, 24]

# UF6 properties
uf6_density: 3.5  # Typical product density

# Full water reflection (conservative)
reflector_material: water
reflector_thickness_cm: 30
