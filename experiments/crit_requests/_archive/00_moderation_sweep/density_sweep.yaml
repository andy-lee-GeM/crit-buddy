# Phase 0: Interstitial Moderation Sweep
# Purpose: Find most reactive water density for multi-unit systems
# Output: k-eff vs water density curve to identify conservative assumption

problem: pipe
name: "Interstitial Moderation Sweep"

# Test geometry: 3 parallel NPS-4 pipes (representative multi-unit case)
cols: 3
pipe_size: "4"
length_cm: 200
gap_cm: 10  # Fixed gap

# Sweep water density from mist to fully flooded
water_density: [0.001, 0.01, 0.05, 0.1, 0.2, 0.3, 0.5, 0.7, 1.0]

# Test at highest enrichment (most sensitive)
enrichment: 24

# Fixed parameters
uf6_density: 5.09
wall_material: ss304
water_thickness_cm: 30
