# =============================================================================
# UO2F2 DRY - INFINITE ARRAY ANALYSIS
# =============================================================================
# Purpose: Demonstrate anhydrous UO2F2 (H/U=0) is SAFE in infinite array
# Key Result: No internal moderation - requires water for criticality
# =============================================================================

problem: cylinder
name: "UO2F2 Dry - Infinite Array"

# -----------------------------------------------------------------------------
# GEOMETRY - 10-inch diameter vessels in infinite array
# -----------------------------------------------------------------------------
rows: 3                         # Unit cell rows (X)
cols: 4                         # Unit cell cols (Y)
layers: 5                       # Unit cell layers (Z)

radius_cm: 12.70                # 5-inch inner radius
height_cm: 100.0                # 1 meter internal height
wall_material: steel
wall_thickness_cm: 0.3175       # 1/8 inch wall

gap_xy_cm: 12.70                # 5-inch horizontal gap (wall-to-wall)
gap_z_cm: 7.62                  # 3-inch vertical gap

# -----------------------------------------------------------------------------
# MATERIAL - Anhydrous UO2F2 (no water of hydration)
# -----------------------------------------------------------------------------
enrichment: 21                  # Bounding HALEU (wt% U-235)

fissile_material: uo2f2
h_to_u_ratio: 0                 # Anhydrous (dry)
fill_fraction: [0.25, 0.50, 0.75, 1.0]  # Fill sweep to establish baseline

# -----------------------------------------------------------------------------
# ENVIRONMENT - Humid air between units
# -----------------------------------------------------------------------------
environment_material: humid_air
void_material: humid_air

# -----------------------------------------------------------------------------
# BOUNDARY - Reflective (infinite array)
# -----------------------------------------------------------------------------
boundary_type: reflective
reflector_thickness_cm: 6.35    # = gap_xy/2 for proper unit cell
