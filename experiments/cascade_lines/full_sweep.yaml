# Cascade Lines - Full Parameter Sweep
# Reference: docs/standards/pipe_schedule_10s.md
# Sweeps: enrichment (LEU/HALEU), reflector (air/water), radius
problem: single_cylinder
name: "Cascade Lines - Full Sweep (Sch 10S)"

# Enrichment (swept)
enrichment: [5.0, 20.0]

# Schedule 10S cascade line inner radii (Ri) in cm
# NPS 1=1.393, 1-1/4=1.831, 1-1/2=2.136, 2=2.739, 2-1/2=3.346
# NPS 3=4.140, 3-1/2=4.775, 4=5.410, 5=6.725, 6=8.073, 8=10.578
radius_cm: [1.393, 1.831, 2.136, 2.739, 3.346, 4.140, 4.775, 5.410, 6.725, 8.073, 10.578]

# Environment (swept)
reflector_material: [air, water]

# Fixed parameters
height_cm: 100.0
wall_material: aluminum
wall_thickness_cm: 0.277  # Conservative (thinnest) - NPS 1, 1-1/4, 1-1/2, 2
reflector_thickness_cm: 30.0
uf6_density: 5.09
